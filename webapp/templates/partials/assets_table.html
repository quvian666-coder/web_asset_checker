<div class="table-wrap"><table class="data-table searchable" aria-label="Web 资产清单"><thead><tr><th>主域名</th><th>子域</th><th>URL</th><th>状态码</th><th>标题</th><th>Server/Banner</th><th>端口</th><th>来源</th></tr></thead><tbody>
{% for item in assets %}<tr><td>{{ item.root_domain }}</td><td>{{ item.subdomain }}</td><td class="url-cell"><a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">{{ item.url }}</a></td><td><span class="http-code code-{{ item.status_code }}">{{ item.status_code or '-' }}</span></td><td>{{ item.title or '-' }}</td><td>{{ item.server or item.banner or '-' }}</td><td>{{ item.port or '-' }}</td><td>{{ item.source or '-' }}</td></tr>{% else %}<tr><td colspan="8" class="empty-cell">暂无 Web 资产，<a href="/#new-scan">新建扫描</a></td></tr>{% endfor %}
</tbody></table></div>
